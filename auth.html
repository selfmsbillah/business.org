<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevConf 2026 | Register & Sign In</title>
    
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Main Style and Auth Style Link -->
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./auth.css">
</head>
<body>

<!-- Header (Main Site Dynamic Follower) -->
<header>
    <div class="container">
        <nav>
            <div class="menu-toggle" id="menu-toggle">
                &#9776;
            </div>

            <a href="./index.html">
                <img src="logo.png" alt="DevConf Logo" class="nav-logo">
            </a>

            <a href="./index.html" class="common-btn hero-btn">Back to Home</a>
        </nav>
    </div>
</header>

<!-- Auth Form Section -->
<main class="auth-wrapper">
    <div class="auth-box">
        <div class="auth-header">
            <h2 id="form-title">Join DevConf 2026</h2>
            <p id="form-subtitle">Create an account to manage your tickets and schedule</p>
        </div>

        <!-- Toggle Switch -->
        <div class="auth-toggle">
            <button class="toggle-btn active" id="btn-register" onclick="switchAuth('register')">Register</button>
            <button class="toggle-btn" id="btn-login" onclick="switchAuth('login')">Sign In</button>
        </div>

        <!-- Google Login -->
        <button class="google-login-btn">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continue with Google
        </button>

        <div class="auth-divider">
            <span>OR</span>
        </div>

        <!-- Form Elements -->
        <form onsubmit="event.preventDefault();">
            <div class="form-group" id="group-name">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="dev@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="common-btn auth-submit-btn" id="btn-submit">Complete Registration</button>
        </form>
    </div>
</main>

<!-- Footer (Exact Copy from Main Code) -->
<footer class="footer-parent">
    <div class="container footer-parent-container">
        <div class="footer-copyright">
            © 2026 DevConf. All rights reserved.
        </div>

        <div class="footer-links">
            <a href="https://github.com/selfmsbillah" target="_blank">GitHub</a>
            <a href="https://www.facebook.com/self.masumbillah/" target="_blank">Facebook</a>
            <a href="https://www.instagram.com/self.masum/" target="_blank">Instagram</a>
        </div>

        <div class="footer-credit">
            Developed by
            <a href="https://selfmsbillah.github.io/masumportfolio.github.io/#contact">Masum Billah</a>
        </div>
    </div>
</footer>

<script>
    function switchAuth(mode) {
        const regBtn = document.getElementById('btn-register');
        const loginBtn = document.getElementById('btn-login');
        const nameGroup = document.getElementById('group-name');
        const title = document.getElementById('form-title');
        const subtitle = document.getElementById('form-subtitle');
        const submitBtn = document.getElementById('btn-submit');

        if (mode === 'login') {
            loginBtn.classList.add('active');
            regBtn.classList.remove('active');
            nameGroup.style.display = 'none';
            title.innerText = 'Welcome Back';
            subtitle.innerText = 'Sign in to access your registered event pass';
            submitBtn.innerText = 'Sign In';
        } else {
            regBtn.classList.add('active');
            loginBtn.classList.remove('active');
            nameGroup.style.display = 'flex';
            title.innerText = 'Join DevConf 2026';
            subtitle.innerText = 'Create an account to manage your tickets and schedule';
            submitBtn.innerText = 'Complete Registration';
        }
    }
</script>

</body>
</html>
